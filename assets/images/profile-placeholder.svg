<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE9FE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="350" cy="350" r="100" fill="rgba(255,255,255,0.1)"/>
  <circle cx="380" cy="80" r="60" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Main circle for avatar -->
  <circle cx="200" cy="160" r="80" fill="url(#circleGradient)"/>
  
  <!-- Simple person silhouette -->
  <circle cx="200" cy="130" r="35" fill="#2563EB"/>
  <ellipse cx="200" cy="210" rx="50" ry="35" fill="#2563EB"/>
  
  <!-- Text -->
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Thushara</text>
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sandeepani</text>
  
  <!-- Decorative line -->
  <line x1="150" y1="350" x2="250" y2="350" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
</svg>
